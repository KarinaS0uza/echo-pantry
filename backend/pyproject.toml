[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-pantry-backend"
version = "0.1.0"
description = "Echo Pantry local Django API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "django-cors-headers>=4.7,<5",
    "django-environ>=0.12,<0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.11,<5",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "common*", "accounts*", "catalog*", "recipes*", "pantry*", "meals*", "sample*"]
namespaces = false
